{% extends "base.html" %}

{% block content %}
<h2>{% if producto %}Editar{% else %}Agregar{% endif %} Producto</h2>

<form method="POST" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-6">
        <label for="nombre" class="form-label">Nombre del Producto</label>
        <input type="text" class="form-control" id="nombre" name="nombre" 
               value="{{ producto[1] if producto else '' }}" required>
    </div>
    
    <div class="col-md-6">
        <label for="precio" class="form-label">Precio</label>
        <input type="number" step="0.01" class="form-control" id="precio" name="precio" 
               value="{{ producto[3] if producto else '' }}" required>
    </div>
    
    <div class="col-12">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">
            {{ producto[2] if producto else '' }}
        </textarea>
    </div>
    
    <div class="col-md-6">
        <label for="categoria" class="form-label">Categoría</label>
        <input type="text" class="form-control" id="categoria" name="categoria" 
               value="{{ producto[4] if producto else '' }}" required>
    </div>
    
    <div class="col-md-6">
        <label for="imagen" class="form-label">Imagen del Producto</label>
        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
        
        {% if producto and producto[6] %}
        <input type="hidden" name="imagen_actual" value="{{ producto[6] }}">
        <small class="form-text text-muted">
            Imagen actual: {{ producto[6] }}
        </small>
        {% else %}
        <input type="hidden" name="imagen_actual" value="">
        {% endif %}
    </div>
    
    <div class="col-12">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="disponible" name="disponible" 
                   {% if not producto or producto[5] %}checked{% endif %}>
            <label class="form-check-label" for="disponible">
                Producto disponible
            </label>
        </div>
    </div>
    
    <div class="col-12">
        <button type="submit" class="btn btn-primary">
            {% if producto %}Actualizar{% else %}Agregar{% endif %} Producto
        </button>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
